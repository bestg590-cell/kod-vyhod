<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>КОД: ВЫХОД — Квесты в реальности</title>
<style>
*{box-sizing:border-box}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#0d1117; color:#f3f5f7; min-height:100vh; display:flex; flex-direction:column;}
button,input,select,textarea{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b5f650; outline-offset:3px;}
:root{--primary:#b5f650; --primary-hover:#cbff7b; --on-primary:#16210d; --bg:#0d1117; --surface:#151b24; --surface-alt:#1c2531; --text:#f3f5f7; --muted:#98a5b5; --border:#2a3543; --error:#ff8585; --success:#8dddac; --accent:#b5f650;}
.wrap{max-width:1248px; padding:0 24px; margin:0 auto; width:100%;}
.site-header{height:88px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); gap:24px;}
.header-wrap{position:sticky; top:0; z-index:50; background:var(--bg); backdrop-filter:blur(8px); border-bottom:1px solid var(--border);}
.logo{font-size:22px; font-weight:900; letter-spacing:-1.1px; display:inline-flex; align-items:center; gap:9px; background:none; color:var(--text); border:0; padding:0;}
.logo-mark{border:2px solid var(--accent); width:27px; height:29px; display:inline-flex; align-items:center; justify-content:center; color:var(--accent); font-size:20px; line-height:1;}
.site-nav{display:flex;gap:24px;align-items:center}
.site-nav a{color:var(--muted); font-size:14px; font-weight:500; transition:color .15s;}
.site-nav a:hover,.site-nav a.on{color:var(--text)}
.header-actions{display:flex;gap:12px;align-items:center}
.icon-btn{border:1px solid var(--border); color:var(--text); background:transparent; border-radius:10px; width:42px; height:42px; display:grid; place-items:center; transition:background .15s,border-color .15s;}
.icon-btn:hover{background:var(--surface-alt);border-color:var(--accent)}
.button{display:inline-flex; align-items:center; justify-content:center; gap:10px; border:1px solid transparent; border-radius:10px; padding:14px 22px; background:var(--primary); color:var(--on-primary); font-size:14px; font-weight:700; min-height:48px; transition:background .15s,transform .15s,border-color .15s;}
.button:hover{background:var(--primary-hover);transform:translateY(-1px)}
.button:disabled{background:var(--surface-alt);color:var(--muted);border-color:var(--border);transform:none}
.button.small{padding:9px 16px;min-height:40px;font-size:13px}
.button.secondary{background:transparent;border-color:var(--border);color:var(--text)}
.button.secondary:hover{background:var(--surface-alt);border-color:var(--accent)}
.button.full{width:100%}
.eyebrow{font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--accent); display:flex; gap:8px; align-items:center;}
.dot{width:6px; height:6px; display:inline-block; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent);}
h1,h2,h3,h4,p{margin:0}
h1{font-size:56px;line-height:1.06;letter-spacing:-2.5px;font-weight:800}
h2{font-size:36px;line-height:1.15;letter-spacing:-1.2px;font-weight:800}
h3{font-size:22px;line-height:1.25;letter-spacing:-.4px}
.lead{font-size:17px;line-height:1.65;color:var(--muted);max-width:540px}
.muted{color:var(--muted)}
.hero{display:grid; grid-template-columns:1.05fr 1fr; gap:44px; padding:64px 0 48px; align-items:center;}
.hero-text h1{margin:20px 0}
.hero-text h1 em{color:var(--accent);font-style:normal}
.hero-actions{display:flex;gap:14px;margin-top:28px;flex-wrap:wrap}
.hero-trust{display:flex;gap:18px;align-items:center;margin-top:28px;font-size:13px;color:var(--muted)}
.hero-art{height:440px; border-radius:20px; position:relative; overflow:hidden; border:1px solid var(--border); background:#111920;}
.hero-art svg{width:100%;height:100%;display:block}
.art-label{position:absolute; top:20px; left:20px; font-size:11px; color:#e1efdf; letter-spacing:2px; display:flex; gap:8px; align-items:center; background:rgba(13,17,23,0.7); padding:6px 12px; border-radius:6px; border:1px solid var(--border);}
.art-bottom{position:absolute; bottom:20px; left:20px; right:20px; padding:16px 20px; background:rgba(13,17,23,0.85); border:1px solid var(--border); border-radius:12px; display:flex; align-items:center; justify-content:space-between; color:#fff; backdrop-filter:blur(8px);}
.art-bottom small{color:#a5b2a8;display:block;margin-bottom:4px;font-size:10px;letter-spacing:1px}
.art-bottom strong{font-size:17px}
.art-bottom span{border:1px solid var(--accent); border-radius:50%; width:36px; height:36px; display:grid; place-items:center; color:var(--accent);}
.benefits{display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--border); border-bottom:1px solid var(--border); padding:28px 0; gap:24px;}
.benefit{display:flex;gap:14px;align-items:center}
.benefit svg{color:var(--accent);width:24px;height:24px;flex-shrink:0}
.benefit b{display:block;font-size:13px;margin-bottom:4px}
.benefit small{font-size:11px;color:var(--muted)}
.section{padding:54px 0}
.section-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:28px; gap:20px;}
.section-head p{font-size:14px;color:var(--muted);margin-top:8px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{border:1px solid var(--border); background:var(--surface); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; transition:transform .2s,border-color .2s;}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card-art{height:200px;position:relative;background:#111820;overflow:hidden}
.card-art svg{width:100%;height:100%;display:block}
.badge{display:inline-flex; align-items:center; gap:5px; border-radius:6px; padding:6px 10px; font-size:10px; font-weight:700; letter-spacing:.5px; background:#10171ae6; color:#d7e8d4; border:1px solid rgba(255,255,255,0.1);}
.card-art .badge{position:absolute;top:14px;left:14px}
.card-content{padding:20px;display:flex;flex-direction:column;flex:1}
.card-content h3{font-size:20px;margin-bottom:8px}
.card-meta{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin:12px 0}
.card-meta span{display:flex;gap:5px;align-items:center}
.card-meta svg{width:14px;height:14px}
.card-desc{font-size:13px;color:var(--muted);line-height:1.6;flex:1;min-height:42px}
.card-bottom{display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--border); padding-top:16px; margin-top:16px;}
.price{font-size:18px;font-weight:700}
.price small{font-size:11px;font-weight:400;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.step{border-top:1px solid var(--border);padding-top:22px}
.step-num{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:14px}
.step h3{font-size:20px;margin-bottom:8px}
.step p{font-size:14px;color:var(--muted);line-height:1.65}
.cta{background:var(--surface-alt); padding:36px; border-radius:18px; display:flex; align-items:center; justify-content:space-between; gap:24px; margin:20px 0 54px; border:1px solid var(--border);}
.cta h2{font-size:28px;margin-bottom:8px}
.cta p{font-size:14px;color:var(--muted)}
.footer{border-top:1px solid var(--border); padding:32px 0; color:var(--muted); font-size:13px; margin-top:auto; background:var(--surface);}
.footer-row{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}
.footer-note{margin-top:20px;font-size:11px;color:var(--muted);line-height:1.6}
.breadcrumbs{padding:24px 0;font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center}
.breadcrumbs button{border:0;background:none;color:var(--muted);padding:0;cursor:pointer}
.breadcrumbs button:hover{color:var(--text)}
.page-title{margin-bottom:28px}
.page-title h1{font-size:44px;letter-spacing:-1.8px;margin-bottom:10px}
.page-title p{font-size:15px;color:var(--muted);line-height:1.6}
.catalog-tools{display:flex;gap:12px;align-items:center;margin-bottom:24px;flex-wrap:wrap}
.input,.select{background:var(--surface); border:1px solid var(--border); border-radius:10px; min-height:48px; padding:12px 14px; color:var(--text); font-size:14px; width:100%; outline:none; transition:border-color .15s,box-shadow .15s;}
.input:focus,.select:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(181,246,80,0.15);}
.input::placeholder{color:var(--muted)}
.input.invalid{border-color:var(--error)}
.select{width:auto;min-width:170px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chip{border:1px solid var(--border); border-radius:8px; padding:9px 15px; color:var(--muted); background:transparent; font-size:12px; font-weight:600; transition:all .15s;}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.selected{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.result-count{font-size:13px;color:var(--muted);margin-bottom:20px}
.detail-layout{display:grid;grid-template-columns:1.5fr 1fr;gap:36px;padding-bottom:48px}
.detail-art{height:380px;border-radius:18px;overflow:hidden;position:relative;border:1px solid var(--border);background:#151d24}
.detail-art svg{width:100%;height:100%}
.detail-art .badge{position:absolute;top:18px;left:18px}
.detail-heading{padding:20px 0}
.detail-heading h1{font-size:42px;letter-spacing:-1.5px;margin:10px 0}
.detail-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:24px 0; padding:20px 0; border-block:1px solid var(--border);}
.detail-stats small{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}
.detail-stats strong{font-size:15px}
.prose{font-size:14px;color:var(--muted);line-height:1.75}
.prose p{margin:12px 0}
.prose h3{color:var(--text);margin:24px 0 8px;font-size:20px}
.notice{padding:16px 18px; background:var(--surface-alt); border-radius:10px; margin-top:20px; color:var(--muted); font-size:13px; line-height:1.65; border:1px solid var(--border);}
.booking-panel{border:1px solid var(--border); border-radius:18px; padding:28px; background:var(--surface); align-self:flex-start; position:sticky; top:108px;}
.booking-panel h3{margin-bottom:8px}
.booking-panel p{font-size:13px;color:var(--muted);line-height:1.5}
.date-chips{display:flex;gap:8px;margin:20px 0 16px;overflow-x:auto;padding-bottom:4px}
.date-chip{min-width:54px; border:1px solid var(--border); border-radius:10px; padding:10px 6px; background:transparent; color:var(--muted); font-size:10px; text-align:center;}
.date-chip b{display:block;font-size:17px;margin:4px 0;color:var(--text)}
.date-chip.selected{border-color:var(--accent);background:var(--surface-alt)}
.date-chip.selected b{color:var(--accent)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 20px}
.slot{border:1px solid var(--border); background:transparent; color:var(--text); border-radius:9px; padding:12px 6px; font-size:13px; text-align:center;}
.slot small{display:block;font-size:10px;margin-top:4px;color:var(--muted)}
.slot:disabled{text-decoration:line-through;color:var(--muted);opacity:.4}
.slot.selected{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.slot.selected small{color:inherit}
.panel-total{border-top:1px solid var(--border); padding-top:18px; margin-bottom:18px; display:flex; justify-content:space-between; align-items:center; font-size:13px;}
.panel-total strong{font-size:24px}
.subnote{text-align:center;font-size:11px;color:var(--muted);margin-top:12px;line-height:1.5}
.form-layout{display:grid;grid-template-columns:1.35fr .8fr;gap:32px;max-width:1050px;margin:0 auto 64px}
.form-card{border:1px solid var(--border);border-radius:18px;background:var(--surface);padding:30px}
.form-card h3{margin-bottom:20px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:8px}
.field.wide{grid-column:1/-1}
.field small{display:block;color:var(--muted);font-size:11px;line-height:1.5;margin-top:6px}
.checkbox{display:flex;gap:10px;font-size:12px;line-height:1.6;color:var(--muted);margin:20px 0;align-items:flex-start}
.checkbox input{width:16px;height:16px;accent-color:var(--primary);margin:3px 0 0;flex-shrink:0}
.summary-art{height:160px;overflow:hidden;border-radius:12px;margin-bottom:20px;background:#131e26}
.summary-art svg{width:100%;height:100%}
.summary-lines{margin:18px 0}
.summary-lines div{display:flex;justify-content:space-between;gap:16px;font-size:13px;padding:10px 0;color:var(--muted);border-bottom:1px solid var(--border)}
.summary-lines b{color:var(--text);font-weight:500}
.success-screen{max-width:540px; text-align:center; margin:44px auto 90px; padding:44px 32px; border:1px solid var(--border); border-radius:20px; background:var(--surface);}
.success-symbol{width:68px; height:68px; border:2px solid var(--accent); border-radius:50%; display:grid; place-items:center; margin:0 auto 20px; color:var(--accent);}
.success-screen h1{font-size:32px;letter-spacing:-1px;margin-bottom:14px}
.success-screen p{color:var(--muted);line-height:1.65;font-size:14px}
.mobile-menu{display:none; flex-direction:column; padding:16px 24px; gap:16px; background:var(--surface); border-bottom:1px solid var(--border);}
.mobile-menu.open{display:flex}
.mobile-menu a{font-size:15px;color:var(--muted);padding:6px 0}
.mobile-menu a:hover{color:var(--text)}
.hamburger{display:none}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); padding:14px 22px; background:var(--text); color:var(--bg); border-radius:10px; font-size:13px; font-weight:600; box-shadow:0 8px 30px rgba(0,0,0,0.3); z-index:100; max-width:calc(100% - 32px); text-align:center;}
@media(max-width:960px){.hero{grid-template-columns:1fr;gap:32px;padding:40px 0}
.hero-art{height:320px}
.benefits{grid-template-columns:repeat(2,1fr)}
.cards{grid-template-columns:repeat(2,1fr)}
.detail-layout{grid-template-columns:1fr}
.booking-panel{position:static}}
@media(max-width:680px){h1{font-size:38px;letter-spacing:-1.2px}
h2{font-size:28px}
.wrap{padding:0 16px}
.site-header{height:70px}
.site-nav{display:none}
.hamburger{display:grid}
.cards{grid-template-columns:1fr}
.steps{grid-template-columns:1fr}
.benefits{grid-template-columns:1fr;gap:16px}
.form-layout{grid-template-columns:1fr}
.form-card{padding:20px}
.fields{grid-template-columns:1fr}
.cta{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<div class="header-wrap">
<div class="wrap">
<header class="site-header">
<button class="logo" data-go="home" aria-label="На главную">
<span class="logo-mark">↗</span>КОД: ВЫХОД<span style="color:var(--accent)">.</span>
</button>
<nav class="site-nav" aria-label="Основная навигация">
<a href="#/catalog" data-go="catalog">Все квесты</a>
<a href="#/contacts" data-go="contacts">Контакты</a>
</nav>
<div class="header-actions">
<button class="icon-btn hamburger" id="menuBtn" aria-label="Меню" aria-controls="mobileMenu" aria-expanded="false">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
</button>
</div>
</header>
</div>
<nav class="mobile-menu" id="mobileMenu">
<a href="#/catalog" data-go="catalog">Все квесты</a>
<a href="#/contacts" data-go="contacts">Контакты</a>
</nav>
</div>
<main id="app"></main>
<footer class="footer">
<div class="wrap">
<div class="footer-row">
<button class="logo" data-go="home">
<span class="logo-mark">↗</span>КОД: ВЫХОД<span style="color:var(--accent)">.</span>
</button>
<span>Сыктывкар · ул. Примерная, 9 · 11:00–22:00</span>
<a href="tel:+79080000000" style="color:var(--accent);font-weight:700">+7 (908) 000-00-00</a>
</div>
<div class="footer-note">
© 2026 КОД: ВЫХОД
</div>
</div>
</footer>
<div id="toast" role="status" class="toast" style="display:none"></div>
<script>
const $ = s => document.querySelector(s);
const app = $('#app');
let svgCounter = 0;
function art(kind = 'Chernobyl') {
const id = 'art_' + svgCounter++;
const c = kind === 'Chernobyl' ? '#b5f650' : kind === 'Casino' ? '#e8b166' : '#75c7de';
return `<svg viewBox="0 0 600 440" preserveAspectRatio="xMidYMid slice" role="img">
<defs>
<radialGradient id="${id}g"><stop stop-color="${c}" stop-opacity=".25"/><stop offset="1" stop-color="#090f14" stop-opacity="0"/></radialGradient>
<linearGradient id="${id}b" x2="0" y2="1"><stop stop-color="#1b252c"/><stop offset="1" stop-color="#080e13"/></linearGradient>
</defs>
<rect width="600" height="440" fill="url(#${id}b)"/>
<ellipse cx="300" cy="200" rx="270" ry="220" fill="url(#${id}g)"/>
<path d="M0 0 150 90V340L0 440M600 0 450 90V340l150 100" fill="#0b1218" stroke="#2c3a42" stroke-width="2"/>
<rect x="180" y="70" width="240" height="280" rx="6" fill="#131e24" stroke="${c}" stroke-width="2"/>
<circle cx="300" cy="210" r="46" fill="#0d1419" stroke="${c}" stroke-width="2"/>
<path d="M300 180v60M270 210h60" stroke="${c}" stroke-width="2"/>
<rect x="460" y="150" width="56" height="74" rx="4" fill="#1a252b" stroke="#3d4f59"/>
<text x="488" y="194" text-anchor="middle" fill="${c}" font-family="monospace" font-size="14">60:00</text>
<text x="300" y="55" text-anchor="middle" fill="#788c80" font-family="monospace" font-size="11" letter-spacing="3">${kind==='Chernobyl'?'CHERNOBYL · ACTIVE':kind==='casino'?'CASINO · CLASSIFIED':'Mortuary'}</text>
</svg>`;
}
let rooms = []; // заполнится с сервера

async function loadRooms() {
  try {
    const res = await fetch('/api/rooms');
    rooms = await res.json();
  } catch (e) {
    console.error('Не удалось загрузить квесты', e);
    rooms = [];
  }
}
const demoDates = [
{day:'СБ',num:'17',month:'ОКТ',full:'17 октября 2026'},
{day:'ВС',num:'18',month:'ОКТ',full:'18 октября 2026'},
{day:'ПН',num:'19',month:'ОКТ',full:'19 октября 2026'},
{day:'ВТ',num:'20',month:'ОКТ',full:'20 октября 2026'},
{day:'СР',num:'21',month:'ОКТ',full:'21 октября 2026'}
];
const state = {page:'home',room:1,date:0,time:'15:00',difficulty:'Все'};
function priceStr(n) { return n.toLocaleString('ru-RU') + ' ₽'; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function currentRoom() { return rooms.find(r=>r.id===state.room) || rooms[0]; }
function toast(msg) {
const t = $('#toast');
t.textContent = msg;
t.style.display = 'block';
clearTimeout(toast.timer);
toast.timer = setTimeout(() => { t.style.display = 'none'; }, 3500);
}
function breadcrumb(label) {
return `<div class="breadcrumbs">
<button data-go="home">Главная</button><span>/</span>
${state.page !== 'catalog' ? '<button data-go="catalog">Квесты</button><span>/</span>' : ''}
<span>${label}</span>
</div>`;
}
function card(r) {
return `<article class="card">
<div class="card-art" style="cursor:pointer" data-room="${r.id}">
${art(r.kind)}
<span class="badge">${r.badge}</span>
</div>
<div class="card-content">
<h3 style="cursor:pointer" data-room="${r.id}">${escapeHtml(r.title)}</h3>
<p class="card-desc">${escapeHtml(r.desc)}</p>
<div class="card-meta">
<span> 60 мин</span>
<span> ${r.players}</span>
<span> ${r.age}</span><span>${r.difficulty}</span>
</div>
<div class="card-bottom">
<div class="price">${priceStr(r.price)} <small>/ ком.</small></div>
<button class="button small" data-room="${r.id}">Выбрать →</button>
</div>
</div>
</article>`;
}
function renderHome() {
const topRooms = rooms.slice(0, 3);
return `
<div class="wrap">
<section class="hero">
<div class="hero-text">
<div class="eyebrow"><span class="dot"></span>Квест-комнаты в Сыктывкаре</div>
<h1>Выйди из рутины.<br>Найди <em>выход.</em></h1>
<p class="lead">60 минут, ваша команда и история, в которой вы - главные герои. Выберите квест и забронируйте приключение</p>
<div class="hero-actions">
<button class="button" data-go="catalog">Выбрать квест →</button>
<button class="button secondary" data-scroll="how">Как это работает</button>

const pages = {home:renderHome,catalog:renderCatalog,quest:renderQuest,booking:renderBooking,contacts:renderContacts,success:renderSuccess};
function render(scroll = false) {
app.innerHTML = (pages[state.page] || renderHome)();
document.querySelectorAll('.site-nav a').forEach(a=>{
const active = a.dataset.go === state.page;
a.classList.toggle('on',active);
if (active) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
});
if(scroll) window.scrollTo({top:0,behavior:'instant'});
}
function route() {
const page = location.hash.replace(/^#\/?/,'').split('/')[0];
state.page = Object.prototype.hasOwnProperty.call(pages,page) ? page : 'home';
render(true);
}
function navigate(page) {
$('#mobileMenu').classList.remove('open');
$('#menuBtn').setAttribute('aria-expanded','false');
if(location.hash === '#/'+page) {state.page=page;render(true);}
else location.hash = '#/'+page;
}
document.addEventListener('click',e=>{
const btn=e.target.closest('button,a,[data-room]');
if(!btn) return;
if(btn.dataset.go) {e.preventDefault();navigate(btn.dataset.go);}
else if(btn.dataset.room) {state.room=Number(btn.dataset.room);navigate('quest');}
else if(btn.dataset.difficulty) {state.difficulty=btn.dataset.difficulty;render();}
else if(btn.dataset.date!==undefined) {state.date=Number(btn.dataset.date);render();}
else if(btn.dataset.time) {state.time=btn.dataset.time;render();}
else if(btn.dataset.scroll) document.getElementById(btn.dataset.scroll)?.scrollIntoView({behavior:'smooth'});
});
$('#menuBtn').addEventListener('click',()=>{
const open=$('#mobileMenu').classList.toggle('open');
$('#menuBtn').setAttribute('aria-expanded',String(open));
});
document.addEventListener('submit', async e => {
  e.preventDefault();

  if (e.target.id === 'bookingForm') {
    const fd = new FormData(e.target);
    const phone = String(fd.get('phone') || '').replace(/\D/g, '');
    if (phone.length < 10 || phone.length > 15) {
      toast('Проверьте номер телефона');
      $('#bookPhone').focus();
      return;
    }

    const r = currentRoom();
    const payload = {
      room_id: r.id,
      date_full: demoDates[state.date].full,
      time: state.time,
      name: fd.get('name'),
      phone: fd.get('phone'),
      email: fd.get('email'),
      players: Number(fd.get('players')) || 4,
      team: fd.get('team') || '',
      comment: fd.get('comment') || ''
    };

    const btn = e.target.querySelector('button[type="submit"]');
    if (btn) btn.disabled = true;

    try {
      const res = await fetch('/api/bookings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Ошибка бронирования');
      navigate('success');
    } catch (err) {
      toast(err.message);
    } finally {
      if (btn) btn.disabled = false;
    }
    return;
  }

  if (e.target.id === 'contactForm') {
    toast('Это демонстрационная форма. Для связи используйте телефон или email.');
  }
});
window.addEventListener('hashchange',route);

(async () => {
  await loadRooms();
  route();
})();
</script>
